# Danbooru 简体中文语言包
#
# 与 config/locales/en.yml 使用相同的键结构。未翻译的键会自动回退到英文，
# 因此本文件可以逐步补全，而不会出现 "translation missing" 报错。
#
# 使用方式：<%= t("navbar.posts") %>，或在 Ruby 代码里 I18n.t("navbar.posts")。
#
# 切换语言：在任意 URL 后附加 ?locale=zh-CN 或 ?locale=en，选择会写入 Cookie
# 并在此后的请求中保持；也可由 Accept-Language 请求头自动判定。

