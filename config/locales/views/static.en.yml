    compliance_2257_title: "18 U.S.C. §2257 Compliance Statement"
    compliance_2257_body_1: "%{app_name} is an image hosting website which allows for the uploading, sharing, and viewing of illustrations, drawings, and computer-generated artwork."
    compliance_2257_body_2: "%{app_name} is exempt from the record keeping requirements of 18 U.S.C. §2257 because the site does not publish sexually explicit photographs or videos of real people. Any photographs or videos of any real people that may be published on this website are not sexually explicit (as defined in 18 U.S.C section 2256) or totally non-nude."
    compliance_2257_body_3: "%{app_name} is not a producer (whether primary or secondary as defined in 18 U.S.C. § 2257) of any of the content found on this website. The website's activities, with respect to such content, are limited to the transmission, storage, retrieval, and/or hosting of content on behalf of third party users."
    compliance_2257_body_4: "Please direct any requests you may have regarding §2257 records in relation to any content found on %{app_name} directly to the respective uploader, artist, or producer of said content."
    compliance_2257_procedures_intro: "%{app_name} abides by the following procedures regarding uploaded content to ensure compliance:"
    compliance_2257_procedure_1: "Requiring all users to be over 18 years old to use the site, register an account, or upload content."
    compliance_2257_procedure_2: "Requiring all uploaded content to be drawn or computer generated artwork."
    compliance_2257_procedure_3: "Prohibiting the upload of any nude or sexually-explicit photographs or videos of any real person."
    compliance_2257_procedure_4: "Prohibiting the upload of any photographs or videos of any real person who is or appears to be under the age of 18."
    compliance_2257_procedure_5: "Moderating all uploaded content and expeditiously removing any content found to be in violation of these policies."
    compliance_2257_flagged_body: "%{app_name} allows content to be flagged as inappropriate by users. Should any content be flagged as illegal or in violation of these policies, it shall be removed from the site without delay."
    compliance_2257_contact_html: "For further assistance in contacting the uploader or producer of any content, in removing content from the site, or for any questions regarding this notice, please %{contact}."

