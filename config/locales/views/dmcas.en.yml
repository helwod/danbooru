en:
  dmcas:
    title: "DMCA Notice"
    template_title: "DMCA Template"
    intro: "Fill out the form below to submit a DMCA takedown request."
    processing_notice: "Please allow up to 48 hours for your request to be processed. You may not receive a response unless further information is needed from you."
    requirements_notice: "This information is required by the DMCA process. If any required information is falsified or omitted, your request may be not be processed. Please submit your information in English."
    copyright_notice: "Please be aware that information that is not protected by copyright may not be removed from the site. This includes artist tags, artist profiles, wiki pages, links to social media profiles or other websites, links to works on other websites, and other factual information not protected by copyright law."
    your_name: "Your name (required)"
    your_email: "Your email address (required)"
    your_contact: "Your contact information (physical address and phone number)"
    infringing_urls_html: "A list of links to each %{app_name} post you would like to have removed (one per line). Please list each individual post, not a tag search or profile page."
    original_urls: "A list of links to the original location of each of these works on your Twitter, Pixiv, or other accounts or personal websites (one per line)."
    proof: "Proof that you are the artist or copyright holder. Proof can include either an email address or message listed on one of your social media profiles (provide a link or describe it below), or a screenshot or .psd file of one of your original works (provide a link below)"
    perjury_agree: "Under penalty of perjury, I attest that the information in this notification is accurate and that I am, or am authorized to act on behalf of, the owner of the rights being infringed by the material listed above."
    good_faith_agree: "I have a good faith belief that the use of the work(s) described above in the material(s) listed here is not authorized by the copyright owner, an agent of the copyright owner, or the law."
    signature: "Your signature (Type your full legal name. This must be your legal name, not a pseudonym or artist handle)"
    submit: "Submit"
    email_preference_html: "If you'd prefer not to use our automated form, you can %{link}. Your email must include the following:"
    email_us: "email us here"
    required_items:
      contact: "Your contact information, including your name, physical address, phone number, and email address."
      identification: "Identification of the material you wish to have removed, with enough information to locate the material. For example, a list of links to each post on %{app_name} you wish to have removed. Screenshots or simply listing your artist tag, artist name, or social media accounts are not sufficient to locate the exact material you wish to have removed."
      copyrighted_work: "Identification of the copyrighted work you claim is being infringed. For example, for each %{app_name} post you claim infringes on your copyright, a link to where the original work was posted on your Pixiv, Twitter, or other social media accounts or personal websites."
      good_faith: "A statement that you have a good faith belief that the use of the work you believe is being infringed was not authorized by the copyright owner, an agent of the owner, or the law."
      accuracy: "A statement that everything contained in the takedown notice is accurate and that, under penalty of perjury, you are the copyright owner or have permission to act on the copyright owner's behalf."
      signature: "Your signature. Typing your full name will suffice. This must be your full legal name, not a pseudonym or artist handle."
    template_footer_html: "%{link}. All of the above information is legally required by the DMCA process. Your notice may not be processed if any required information is omitted or falsified."
    template_link: "Here's a template from the US Copyright Office you can follow"
    submitted_html: "Your DMCA notice has been submitted. Please allow up to 48 hours for it to be processed. A confirmation email will be sent to %{email}. You may not receive a response unless further information is needed from you. You may contact %{contact} if you have any further questions."
    submitted_your_name: "Your name: %{name}"
    submitted_your_email: "Your email: %{email}"
    submitted_your_address: "Your address: %{address}"
    infringing_urls_heading: "Infringing URLs:"
    original_urls_heading: "Original URLs:"
    submitted_proof: "Proof that you are the artist: %{proof}"
    submitted_signature: "Your signature: %{signature}"
    template_heading: "Request for Removal of Infringing Material"
    template_intro: "I hereby request that you remove or disable access to the following material as it appears on your service:"
    template_infringing_item: "List of links to each %{app_name} post would you like to have removed."
    template_originals_intro: "These works infringe upon my original copyrighted works located at:"
    template_originals_item: "List of links where each work above was originally posted by you on your social media accounts or personal websites."
    template_authority: "I am the exclusive rights holder or the duly authorized representative of the exclusive rights holder for the works listed above. I have a good faith belief that the use of this material in such a fashion is not authorized by the copyright holder, the copyright holder's agent, or the law."
    template_perjury: "Under penalty of perjury, I attest that the information in this notification is accurate and that I am, or am authorized to act on behalf of, the owner of the rights being infringed by the material listed above."
    template_contact_html: "You may contact me at <b>[Your email address]</b>, <b>[Your phone number]</b>, or <b>[Your mailing address]</b>, preferably by <b>[Your preferred contact method]</b>."
    template_signed: "Signed,"
    template_legal_name: "[Your full legal name]"
    template_send_html: "You may send the above notice to %{email}."
