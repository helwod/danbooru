"zh-CN":
  dmcas:
    title: "DMCA 通知"
    template_title: "DMCA 模板"
    intro: "请填写下面的表单，提交 DMCA 下架请求。"
    processing_notice: "请求最多需要 48 小时处理。除非需要我们进一步联系你，否则可能不会收到回复。"
    requirements_notice: "以下信息是 DMCA 流程的必需内容。若必需信息造假或缺失，请求可能无法处理。请使用英文填写。"
    copyright_notice: "请注意，不受版权保护的信息可能不会被移除，包括画师标签、画师资料、维基页面、社交媒体或其他网站的链接、其他网站上作品的链接，以及不受版权法保护的其他事实性信息。"
    your_name: "你的姓名（必填）"
    your_email: "你的邮箱地址（必填）"
    your_contact: "你的联系信息（通信地址和电话号码）"
    infringing_urls_html: "希望移除的每条 %{app_name} 作品链接（每行一条）。请逐条列出具体作品，不要填写标签搜索页或个人主页。"
    original_urls: "上述每件作品原发布位置的链接，例如你的 Twitter、Pixiv 或其他账号、个人网站（每行一条）。"
    proof: "证明你是作者或版权持有人的材料。可以是社交媒体资料中列出的邮箱或留言（在下方提供链接或文字说明），也可以是原创作品的截图或 .psd 文件（在下方提供链接）"
    perjury_agree: "本人以受伪证罪处罚为前提声明：本通知中的信息准确无误，本人就是上述材料所侵犯权利的所有人，或已获授权代表该所有人行事。"
    good_faith_agree: "本人善意地认为，上述作品在上述材料中的使用未获得版权所有人、版权所有人的代理人或法律的许可。"
    signature: "你的签名（请填写完整法定姓名，不能是化名或画师名）"
    submit: "提交"
    email_preference_html: "如果你不想使用这个自动表单，也可以%{link}。邮件中必须包含以下内容："
    email_us: "通过这里给我们发邮件"
    required_items:
      contact: "你的联系信息，包括姓名、通信地址、电话号码和邮箱地址。"
      identification: "希望移除的材料说明，并提供足以定位该材料的信息。例如希望移除的每条 %{app_name} 作品链接。截图，或仅提供画师标签、画师名、社交账号，都不足以定位你希望移除的具体材料。"
      copyrighted_work: "你认为被侵权的版权作品说明。例如，对你主张被侵权的每条 %{app_name} 作品，提供该作品原发布于你的 Pixiv、Twitter 等社交账号或个人网站的链接。"
      good_faith: "声明你善意地认为，你所主张被侵权作品的使用未获得版权所有人、其代理人或法律的许可。"
      accuracy: "声明本下架通知中的全部内容真实准确，且你以受伪证罪处罚为前提确认自己是版权所有人，或已获其授权代为行事。"
      signature: "你的签名。输入完整姓名即可，但必须是完整法定姓名，不能是化名或画师名。"
    template_footer_html: "%{link}。以上所有信息均为 DMCA 流程的法定要求。若缺少或伪造任何必需信息，通知可能无法处理。"
    template_link: "可参考美国版权局的这份模板"
    submitted_html: "你的 DMCA 通知已提交，最多需要 48 小时处理。确认邮件将发送至 %{email}。除非需要我们进一步联系你，否则可能不会收到回复。如有其他疑问，可以联系 %{contact}。"
    submitted_your_name: "你的姓名：%{name}"
    submitted_your_email: "你的邮箱：%{email}"
    submitted_your_address: "你的地址：%{address}"
    infringing_urls_heading: "侵权链接："
    original_urls_heading: "原始链接："
    submitted_proof: "作者身份证明：%{proof}"
    submitted_signature: "你的签名：%{signature}"
    template_heading: "侵权材料移除请求"
    template_intro: "本人特此要求你移除或禁用以下在你的服务中出现的材料："
    template_infringing_item: "希望移除的每条 %{app_name} 作品链接列表。"
    template_originals_intro: "上述作品侵犯了本人的原创版权作品，原作品位于："
    template_originals_item: "上述每件作品原发布位置的链接列表，例如你的社交媒体账号或个人网站。"
    template_authority: "本人是上述作品的专有权利人，或专有权利人正式授权的代理人。本人善意地认为，以此方式使用该材料未获得版权所有人、版权所有人的代理人或法律的许可。"
    template_perjury: "本人以受伪证罪处罚为前提声明：本通知中的信息准确无误，本人就是上述材料所侵犯权利的所有人，或已获授权代表该所有人行事。"
    template_contact_html: "你可以通过 <b>[你的邮箱地址]</b>、<b>[你的电话号码]</b> 或 <b>[你的邮寄地址]</b> 联系本人，推荐使用 <b>[首选联系方式]</b>。"
    template_signed: "签名："
    template_legal_name: "[完整法定姓名]"
    template_send_html: "你可以将上述通知发送至 %{email}。"
