    title: "Moderation Queue"
    guidelines: "Guidelines"
    guideline_approve: "You should approve anything you think is good quality. A good rule of thumb is to approve things you would upload yourself."
    guideline_skip: "If you're unsure whether something should be approved, you can skip it and let other approvers take a look."
    guideline_reject: "You can reject a post as \"Poor quality\" or \"Breaks rules\" to tell other approvers that you think the post shouldn't be approved."
    guideline_detailed_rejection: "You can give a \"Detailed rejection\" to explain why you think a post shouldn't be approved. This message is seen by the uploader, so don't be rude."
    guideline_delete_html: "Posts should only be manually deleted if they clearly break the %{link} or are extremely bad (so bad they shouldn't stay up the full 3 days)."
    guideline_inactivity: "If you haven't approved at least 30 posts in the last 45 days, you will lose approver privileges for inactivity."
