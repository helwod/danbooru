"zh-CN":
  terms_of_service:
    title: "服务条款"
    last_updated: "最后更新：2022 年 10 月 23 日"
    intro_1: "本服务条款（以下称「本条款」）规范你访问和使用本站与本服务的行为。访问或使用本站，即表示你同意受本条款约束。如果你不同意本条款，则不得访问或使用本站。"
    intro_2_html: "除本服务条款外，%{upload_rules}、%{community_rules}以及%{privacy_policy}同样规范你对本站的使用。"
    upload_rules_link: "上传规则"
    community_rules_link: "社区规则"
    privacy_policy_link: "隐私政策"

    access:
      heading: "访问本站"
      minors: "未满 18 岁者不得注册账户或以其他方式使用本服务。使用本服务即表示你已达到所在国家法律规定的可注册账户的年龄。"
      terminate_html: "我们可随时以任何理由或无理由暂停或终止你的账户，或暂停、终止你访问、使用本站的权限，包括因你违反本条款、%{upload_rules}或%{community_rules}。"

    cannot:
      heading: "你不能做的事"
      intro_html: "访问或使用本站时，你同意遵守本服务条款、%{upload_rules}以及%{community_rules}。"
      will_not: "访问或使用本站时，你不得："
      multiple_accounts: "注册多个账户以规避封禁、账户限制或站内规则，或用于发送垃圾信息。"
      bypass_limits: "绕过或规避施加于你账户的任何限制，包括上传限额、评论限额、频率限制、作品访问限制以及其他任何限制。"
      share_account: "把你的账户分享、出售、交换、转让给其他用户，或允许其他用户使用。"
      sell_accounts: "出售或交换特殊权限账户，包括黄金、白金或 Builder 账户。"
      spam: "发送垃圾信息或未经请求的消息，包括通过评论、论坛帖子和站内信发送。"
      unauthorized_access: "试图未经授权访问其他用户的账户、本站，或本站使用的任何计算机系统或网络。"
      malware: "向本站上传恶意软件、计算机病毒或其他恶意内容，或通过本站传播、链接此类内容。"
      disrupt: "阻止或干扰其他用户使用本站，或以任何方式破坏、加重负担或损害本站的运行。"
      bots: "创建、使用或传播会对本站造成损害的机器人或脚本，或让用户得以绕过本站限制的机器人或脚本。"

    content:
      heading: "用户生成的内容"
      responsibility: "提交到本站的所有内容，包括文字、链接、翻译、图片、视频、动画、歌曲、游戏以及其他任何素材（以下合称「内容」），均由提交该内容的人自行负责。我们对用户提交到本站的内容不承担任何责任。"
      must_abide_html: "你提交到本站的任何内容都必须遵守本服务条款、%{upload_rules}以及%{community_rules}。虽然我们没有义务监控、审查或审核提交到本站的任何内容，但我们可自行决定随时以任何理由删除内容或移除对内容的访问权限，包括因内容违反本条款、违反我们的上传规则，或你因此给我们带来责任。"
      exposure: "你理解，在使用本站时，你可能会接触到可能被视为冒犯、有害、淫秽、不准确、标注错误、标签错误、在你所在司法辖区违法或具有其他不当性质的内容。使用本站发布的任何内容，或使用你通过本站获取的任何内容，风险由你自行承担。我们不认可、不支持、不陈述也不保证本站发布的任何内容或通讯的完整性、真实性、准确性或可靠性，也不认可通过本站表达的任何观点。"
      rights: "通过向本站提交、发布或上传任何内容，你陈述并保证你拥有授予本条款所载「你的内容」相关权利所需的全部权利、权力与授权。你同意，你对自己提供给本站的任何内容负责，包括遵守任何适用的法律、规则与法规。由于「你的内容」完全由你负责，若你在不具备全部必要权利的情况下发布或分享内容，你可能使自己承担相应责任。"
      license: "通过向本站提交内容，你授予 %{app_name} 一项全球范围、免版税、永久、不可撤销、非独占、可转让且可再授权的许可，允许其以目前已知或日后开发的所有媒体格式与渠道使用、复制、修改、改编、分发、创作衍生作品、允许下载以及展示「你的内容」。"

    copyright:
      heading: "版权侵权"
      dmca_intro: "《数字千年版权法》（DMCA）是美国的一部法律。只要网站遵守 DMCA 规定的通知与下架程序，该法就保护网站免因用户发布的内容而被主张版权侵权。"
      report_html: "如果你认为本站的任何内容侵犯了你的版权，可以通过我们的%{form}举报，或向 %{email} 发送有效的 DMCA 通知。"
      report_form_link: "DMCA 举报表单"
      notice_methods: "DMCA 通知必须通过上述方式之一提交。有效的 DMCA 通知必须包含以下全部内容："
      required_1: "你的联系信息，包括姓名、实际通信地址、电话号码和邮箱地址。"
      required_2: "指明你主张构成侵权并希望移除的材料，并提供足以定位该材料的足够信息。例如，列出你希望移除的每一个 %{app_name} 作品的链接。截图，或仅列出你的画师标签、画师名或社交媒体账号，都不足以精确定位你希望移除的材料。"
      required_3: "指明你主张被侵权的那件作品。例如，对你主张侵犯你版权的每一个 %{app_name} 作品，提供该作品原作发布在你的社交媒体账号或个人网站上的链接，或对该作品作出清晰的书面描述。"
      required_4: "一份声明，说明你善意地认为你所主张被侵权的作品的使用未获版权所有者、所有者代理人或法律的授权。"
      required_5: "一份声明，说明下架通知中的全部内容均属实，并且你在伪证罪处罚的前提下，是版权所有者或已获授权代表版权所有者行事。"
      required_6: "你的实体或电子签名，或经授权代表被主张版权受侵犯之人行事者的签名。签名必须为该人的完整法定姓名，不能使用化名。"
      required_note: "上述信息均为 DMCA 流程所必需。如果任何必需信息被遗漏或伪造，你的 DMCA 通知可能无法处理。"
      fair_use: "某些对受版权保护材料的使用可能无需版权所有者许可。在美国，这一概念被称为合理使用。如果你明知不实地声称本站的任何活动或材料构成侵权，你可能需承担相应费用与损害赔偿。"
      factual_info: "请注意，事实性信息通常不受版权保护，可能不会被从本站移除，包括标签、画师资料、维基页面、指向画师社交媒体资料或其他网站的链接、指向其他网站上作品的链接，以及任何其他不受版权保护的事实性信息。"

    upgrade:
      heading: "账户升级"
      payment: "你可以提交借记卡、信用卡或其他支付信息（以下称「支付信息」），以购买本站的黄金或白金账户升级，或其他产品或服务。我们会依照隐私政策，使用第三方服务提供商处理你的支付信息。如果你提交支付信息，即表示你同意支付你产生的全部费用，并授权我们在付款到期时向你收取包含这些费用及任何适用税费的金额。"
      fees: "我们可在合理提前通知的情况下，不时调整黄金与白金账户升级所涉的费用与权益；但对于临时促销（包括临时降低此类账户升级的相关费用），无需提前通知。"

    api:
      heading: "API 使用"
      rate_limits_html: "如果你使用我们的 API，即表示你同意遵守我们的%{api_docs}中所述的频率限制。"
      api_docs_link: "API 文档"

    privacy:
      heading: "隐私"
      body_html: "我们的%{privacy_policy}说明了我们在你使用本服务时如何处理获取到的关于你的信息。你理解，使用本服务即表示你同意我们按隐私政策所述收集和使用你的信息。"

    misc:
      heading: "其他"
      definitions: "「%{app_name}」「我们」指 %{app_name} 及其承继者与受让人。「你」指任何已同意本条款或已在合同上受其约束的人，无论其在当时是否已被具名指明。"
      entire_agreement: "本条款构成你与我们之间就访问和使用本服务达成的完整协议。我们未行使或执行本条款的任何权利或条款，不构成对该权利或条款的放弃。如果本条款的任何条款因任何原因被认定为违法、无效或不可执行，本条款的其余部分仍继续有效。未经我们同意，你不得转让本条款下的任何权利或义务。我们可自由转让本条款。"

    changes:
      heading: "本条款的变更"
      body_1: "我们可能会不时更新本条款。更新后的条款会在本页顶部标注新的「最后更新」日期。如果本条款发生重大变更，我们可自行决定通过显著位置发布变更通知，或直接向你发送通知。"
      body_2: "本条款的变更自更新后的条款可被访问时起生效。变更生效后你继续使用本服务，即表示你同意受修订后条款的约束。"

    warranties:
      heading: "免责声明"
      body: "本服务按「现状」与「现有可用」提供，不作任何明示或默示的保证，包括但不限于对适销性、特定用途适用性和不侵权的默示保证。%{app_name}、其许可方及其第三方服务提供商不保证本服务准确、完整、可靠、及时或无错误。%{app_name} 不控制、不认可也不对本服务上或链接至本服务的任何内容，或任何第三方或用户（包括版主）的行为承担责任。尽管 %{app_name} 力求让你安全地访问和使用本服务，我们并不陈述或保证本服务或服务器不含病毒或其他有害组件。"

    liability:
      heading: "责任限制"
      body: "在任何情况下，无论基于何种责任理论（包括合同、侵权、过失、严格责任、保证或其他），%{app_name} 相关主体均不就因本条款或本服务产生或与之相关的任何间接、后果性、惩戒性、附带性、特殊性或惩罚性损害，或利润损失，向你承担责任，包括因本服务上提供的内容被指诽谤、冒犯或违法而产生或与之相关的损害。访问和使用本服务由你自行决定并自担风险，你将对由此导致的设备或计算机系统损坏或数据丢失承担全部责任。在任何情况下，%{app_name} 相关主体的累计责任均不超过一百美元（$100）与你就引起索赔的服务在前六个月内向 %{app_name} 支付的金额二者中的较高者。本节的限制适用于任何责任理论，包括基于保证、合同、成文法、侵权（含过失）或其他理论，即使 %{app_name} 相关主体已被告知发生此类损害的可能性，即使本协议所载的任何救济被认定未能实现其基本目的。上述责任限制在适用司法辖区法律允许的最大范围内适用。"
