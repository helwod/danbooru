    compliance_2257_title: "18 U.S.C. §2257 合规声明"
    compliance_2257_body_1: "%{app_name} 是一个图片托管网站，用户可以上传、分享和浏览插画、绘图以及由计算机生成的美术作品。"
    compliance_2257_body_2: "%{app_name} 不受 18 U.S.C. §2257 记录保存要求的约束，因为本站不发布真实人物的色情照片或视频。本站可能发布的任何真实人物照片或视频均不属于色情内容（按 18 U.S.C 第 2256 条的定义），或完全不露点。"
    compliance_2257_body_3: "%{app_name} 不是本站任何内容的制作者（无论 18 U.S.C. §2257 定义的一级还是二级制作者）。本站对这些内容的相关行为，仅限于代第三方用户传输、存储、检索和/或托管内容。"
    compliance_2257_body_4: "如需就本站任何内容相关的 §2257 记录提出请求，请直接联系该内容对应的上传者、画师或制作者。"
    compliance_2257_procedures_intro: "%{app_name} 对上传内容遵守以下流程，以确保合规："
    compliance_2257_procedure_1: "要求所有用户年满 18 岁才能使用本站、注册账户或上传内容。"
    compliance_2257_procedure_2: "要求所有上传内容必须是手绘或计算机生成的美术作品。"
    compliance_2257_procedure_3: "禁止上传任何真实人物的裸体或色情照片、视频。"
    compliance_2257_procedure_4: "禁止上传任何真实人物的照片或视频，如果该人物未满 18 岁或看起来未满 18 岁。"
    compliance_2257_procedure_5: "对所有上传内容进行审核，并尽快删除被认定违反上述政策的内容。"
    compliance_2257_flagged_body: "%{app_name} 允许用户把内容标记为不当内容。若任何内容被标记为违法或违反上述政策，将立即从本站移除。"
    compliance_2257_contact_html: "如需协助联系任何内容的上传者或制作者、从本站移除内容，或对本声明有任何疑问，请%{contact}。"

