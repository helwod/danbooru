"zh-CN":
  privacy_policy:
    title: "隐私政策"
    last_updated: "最后更新：2020 年 7 月 5 日"
    intro: "本隐私政策说明 %{app_name}（以下合称「我们」）在你使用我们的网站或服务（以下称「本站」或「本服务」）时会收集你的哪些信息、我们如何使用这些信息，以及你对自己的信息拥有哪些权利。"
    contact_html: "如果本隐私政策中有任何条款或条件你无法认同，请停止使用本站与本服务。如果你对本政策或我们对个人信息的处理方式有任何疑问或顾虑，可以通过 %{email} 联系我们。"

    what_we_collect:
      heading: "我们收集哪些信息"
      provide:
        heading: "你主动提供的信息"
        summary: "摘要：我们收集你直接提供给我们的信息。"
        intro: "我们会收集你在使用本服务时直接提供给我们的信息。具体收集哪些信息取决于你如何使用本服务。可能收集的信息包括："
        account_html: "<strong>账户信息</strong>。当你注册账户时，我们会收集你的用户名、密码，以及可选的邮箱地址。我们也会保存你的账户偏好与设置。你可以随时更新账户信息，包括修改用户名或注销账户，详见下文。"
        content_html: "<strong>你提交的内容</strong>。我们会收集你提交到本站的内容，包括你发布或上传到本站的图片、视频或文字内容，例如作品、评论、论坛帖子、翻译批注、维基页面、合集、画师说明，以及你对本站作出的其他任何贡献。"
        actions_html: "<strong>你的操作行为</strong>。我们会收集你在使用本站时的操作信息，包括收藏或给内容投票、标记或举报内容、发送站内信、保存搜索、浏览论坛主题等，也包括你对本站任何内容作出的编辑或修改。"
        payment_html: "<strong>支付信息</strong>。如果你在我们这里付款，我们会收集处理支付所必需的信息，包括你的信用卡号、安全码与有效期、你的邮箱地址、你的位置（例如国家、邮编、账单地址，以及付款时所处的位置）和你的 IP 地址。"
        other_html: "<strong>其他信息</strong>。你也可以选择直接向我们提供其他信息。例如，在你参与问卷调查、投票、推广活动、抽奖或其他本站主办的活动时，在你向我们请求支持时，或你直接通过邮件联系我们时，我们可能会收集相关信息。"
      automatic:
        heading: "我们自动收集的信息"
        summary: "摘要：我们会自动收集一些关于你的信息，包括你的 IP 地址、你所用电脑的信息，以及你使用本站的情况。"
        logs_html: "<strong>日志与使用数据</strong>。在你访问或使用本服务时，我们可能会记录关于你的信息，包括你的 IP 地址、浏览器类型与版本、电脑或设备类型、设备特征（例如屏幕分辨率或操作系统版本）、语言与时区偏好，以及你的地理位置或国家信息。这类信息也可能包括你使用本站的情况，例如你浏览过的作品、访问过的页面、点击过的链接，以及执行过的搜索。"
        cookies_html: "<strong>Cookie</strong>。我们可能会从 Cookie 及类似技术中获取信息。Cookie 是浏览器保存并在发起请求时回传给我们的数据片段。我们使用这些信息维持登录会话，并保存账户设置与偏好。"
      other_sources:
        heading: "我们从其他来源收集的信息"
        summary: "摘要：如果你把其他网站关联到你的 %{app_name} 账户，我们会从这些网站获取你的个人资料信息。"
        body: "我们可能会从其他来源获取关于你的信息，并与我们已掌握的关于你的其他信息合并。例如，我们可能会允许你把 %{app_name} 账户关联到你在其他网站上的账户，例如你的 Google、Twitter 或其他账户。如果你选择把第三方账户关联到你的 %{app_name} 账户，我们会按下文「我们如何处理关联账户」一节所述，从该账户收集关于你的信息。"

    usage:
      heading: "我们如何使用你的信息"
      summary: "摘要：我们使用你的信息向你提供服务、运营本站，以及执行我们的服务条款。"
      intro: "我们会把你的信息用于："
      provide_html: "<strong>向你提供服务</strong>。我们可能会使用你的信息向你提供本服务，并为你提供支持或客户服务。"
      manage_html: "<strong>管理你的账户</strong>。我们可能会使用你的信息让你登录并管理账户、保存账户偏好、帮助你恢复账户访问权限，以及向你发送与你相关的管理类消息或通知。"
      protect_html: "<strong>保护我们的服务</strong>。我们可能会使用你的信息维护本服务的安全稳定运行，包括执行我们的服务条款、发现并阻止对本服务的滥用、对本服务进行审核、拦截垃圾信息、防止欺诈，以及排查本站的问题。"
      monitor_html: "<strong>监测本服务的使用情况</strong>。我们可能会使用你的信息维护并改进本服务、分析趋势、监测本站的使用情况与性能、生成内部报表与分析、研究和开发新服务，以及发布关于本站使用情况的公开报告，例如热门搜索、热门页面和作品浏览量的信息。"
      login_html: "<strong>便于注册与登录</strong>。如果你选择把第三方账户（例如你的 Google 或 Twitter 账户）关联到你的 %{app_name} 账户，我们可能会使用你允许我们从这些第三方收集的信息为你创建新的 %{app_name} 账户，或让你使用第三方账户登录 %{app_name}。更多信息请见下文「我们如何处理关联账户」一节。"
      legal_html: "<strong>回应法律请求</strong>。如果我们收到传票或其他法律请求，可能需要检查我们持有的数据，以确定如何回应。"

    sharing:
      heading: "你的信息会如何被共享"
      summary: "摘要：%{app_name} 上的大部分活动都是公开的。未经你同意，我们不会把你的信息分享给广告商。除在特定条件下确有必要外，我们不会把你的信息分享给第三方。"
      intro: "当你使用本站时，关于你的一些信息可能会被分享给其他用户、本站版主或其他获授权用户，或分享给公众。例如："
      content: "你创建或提交到本站的任何内容，除另有说明外，都会对其他用户和公众可见，包括你的上传、评论、论坛帖子、合集、维基页面、翻译批注，以及你对本站作出的其他任何贡献。"
      edits: "你对本站作出的任何编辑，除另有说明外，都会对其他用户和公众可见，包括你的标签编辑、合集编辑、维基编辑、翻译批注编辑、画师编辑、说明编辑，以及你对本站其他任何内容所作的任何编辑、改动或修改。"
      personal: "你在本站的其他个人活动，例如你的收藏、收藏分组和已保存的搜索，通常会对其他用户和公众可见，除非另有说明，或你选择把这些内容设为私密。"
      private: "某些信息（例如你的收藏或收藏分组）你可以选择设为私密。但在运营本站确有正当需要时，这些信息仍可能对本站版主或其他获授权用户可见。"
      username: "你创建或编辑本站任何内容时，你的用户名都会与之公开关联。你创建或编辑内容的时间也会公开可见。版主还可能看到与你创建或编辑的本站内容相关联的 IP 地址。"
      profile: "当其他用户查看你的个人资料时，他们可以看到你在本站活动的信息，例如你的用户名、注册日期、上传、收藏、投票、作品编辑历史、评论、论坛帖子、黄金或白金账户状态。"
      messages: "当你给其他用户发送站内信时，收件人可以看到你的站内信内容、你的用户名，以及发送时间。收件人可能选择把你的站内信公开或分享给其他用户。收件人也可以选择把站内信转发到自己的邮箱，因此这些用户收到的站内信将同时受该用户邮箱服务商条款与政策的约束。"
      moderators: "我们可能自行决定，允许本站版主或其他获授权用户查看站内信，以应对运营本站的正当需要，例如拦截垃圾信息或执行我们的服务条款。"
      third_party_api: "我们可能允许第三方访问、收集、存档或再分发通过我们的 API 或我们提供的公开数据转储所收集的信息。即使这些信息已从 %{app_name} 删除，第三方仍可能保有其存储的副本。"
      otherwise: "除此之外，我们不会向第三方分享、出售或提供你的个人信息，除非属于以下情形之一："
      consent_html: "<strong>经你同意</strong>。我们可能经你同意或按你的指示分享你的信息。"
      providers_html: "<strong>与我们的服务提供商共享</strong>。我们可能与需要访问这些信息以替我们完成工作的供应商、顾问和其他服务提供商分享信息（但不会与广告商或广告合作伙伴分享）。合作伙伴对个人数据的使用须遵守适当的保密与安全措施。"
      aggregated_html: "<strong>汇总或匿名化信息</strong>。我们可能分享经过汇总或匿名化处理、已无法合理用于识别你身份的信息。例如，我们可能显示某个作品的访问总次数，但不透露访客是谁；或显示某个标签被搜索的次数，但不透露搜索者是谁。"
      enforce_html: "<strong>执行我们的政策与权利</strong>。如果我们认为你的行为违反了我们的用户协议、规则或其他政策，或为保护我们与他人的权利、财产和安全，我们可能分享信息。"
      law_html: "<strong>遵守法律</strong>。如我们收到信息调取请求，且认为披露符合或受制于任何适用的法律、法规、法律程序或政府要求（包括但不限于满足国家安全或执法要求），我们可能分享信息。在法律允许的范围内，我们会在按此类请求披露你的信息之前尽量提前通知你。"
      emergency_html: "<strong>紧急情况</strong>。如果我们认为为防止某人即将遭受严重人身伤害确有必要，我们可能分享信息。"
      transfers_html: "<strong>业务转让</strong>。在合并、出售公司资产、融资，或把我们的全部或部分业务转让给另一家公司的交易中或谈判期间，我们可能分享或转移你的信息。"

    linked:
      heading: "我们如何处理关联账户"
      summary: "摘要：如果你把其他网站关联到你的 %{app_name} 账户，我们会从这些网站获取你的个人资料信息，但不会向你关联的这些网站披露关于你的任何信息。"
      body_1: "我们可能会允许你使用第三方社交媒体账户（例如你的 Google 或 Twitter 账户）注册或登录，或把其他第三方账户关联到你的 %{app_name} 账户。如果你选择这样做，我们会从相应第三方服务获取关于你的某些个人资料信息。我们获取的资料信息因服务而异，但通常包括你的用户名、邮箱地址、头像，以及你公开资料中的其他信息。"
      body_2: "我们只会把获取到的信息用于本隐私政策所述的目的，或用于在你关联账户时向你说明的功能。你可以随时解除账户与第三方账户的关联，解除后我们将删除从这些服务收集到的关于你的信息。"
      body_3: "未经你同意，我们不会把从第三方服务收集到的关于你的信息用于营销目的。我们不会向你关联过 %{app_name} 账户的任何第三方网站披露关于你或你使用本站情况的任何信息。但请注意，我们无法控制也不对第三方网站的行为负责。建议你查阅它们的隐私政策，了解它们如何收集、使用和分享你的个人信息，以及如何在其网站与应用中设置隐私偏好。"

    controlling:
      heading: "掌控你的信息"
      access:
        heading: "查看与修改你的信息"
        body_html: "如果你想查看或修改账户中的信息，例如用户名、密码、邮箱地址或其他设置，可以前往%{settings}进行更新。"
        settings_link: "账户设置"
      delete:
        heading: "注销你的账户"
        summary: "摘要：你可以注销账户，但我们可能保留你的 IP 地址以及你对本站的公开贡献。"
        body_1_html: "如果你想关闭自己的 %{app_name} 账户，可以%{here}注销账户。"
        here_link: "在这里"
        body_2: "账户注销后，我们会从在用系统中删除你的非公开个人信息，包括邮箱地址、密码、账户偏好、已保存的搜索和私密收藏，并把你的用户名与你提交到本站的内容解除关联，包括你的上传、投票、评论、论坛帖子、站内信、翻译批注、维基页面、标签编辑，以及你对本站作出的其他公开贡献。"
        body_3: "请注意，你提交到本站的内容不会在账户注销后从本站移除。具体来说，你的上传不会被移除，你发给其他用户的站内信不会被删除，你的评论和论坛帖子除你在注销前自行删除外仍会对他人可见。其他用户发布并提及你的名字或引用你的评论、论坛帖子或站内信，同样仍会对他人可见。"
        body_4: "账户注销后，我们可能仍保留某些关于你的其他信息，包括你的 IP 地址、用户 ID、你使用过的历史用户名，以及与你账户关联的其他标识。我们可能按法律要求，或为正当业务需要（例如防止垃圾信息、滥用，或防止违反我们的服务条款）保留这些信息。"
      email:
        heading: "管理邮件通讯"
        body_html: "如果你不希望收到本服务发送的邮件，可以点击我们所发邮件中的退订链接，或在你的%{settings}中关闭邮件通知。我们仍可能向你发送与账户使用或安全相关的邮件，例如重置密码时的邮件。"
      cookies:
        heading: "管理 Cookie"
        body: "大多数网络浏览器默认接受 Cookie。如果你愿意，通常可以在浏览器中删除或拒绝第一方和第三方 Cookie。请注意，删除或拒绝 Cookie 可能影响本站的可用性与功能。"

    other:
      heading: "其他信息"
      minors:
        heading: "未成年人"
        body: "未满 18 岁者不得注册账户或以其他方式使用本服务。使用本服务即表示你已达到所在国家法律规定的、可注册账户或以其他方式使用本服务的年龄。"
      retention:
        heading: "数据保留"
        summary: "摘要：除法律另有要求外，我们会在实现本隐私政策所述目的所需的期限内保留你的信息。"
        body_1: "我们会在最初收集信息的目的所需期限内存储所收集的信息。出于正当业务需要或法律要求，我们可能保留某些信息。"
        body_2: "当我们不再有处理你个人信息的正当业务需要时，我们会删除或匿名化这些信息；如无法做到（例如你的个人信息已存入备份归档），我们会安全地存储你的个人信息，并在删除可行之前将其隔离，不再作任何进一步处理。"
      transfers:
        heading: "跨境数据传输"
        summary: "摘要：我们在美国存储数据，并在美国法律下运营。"
        body: "我们的基地位于美国，信息在美国境内的服务器上处理和存储。根据多种因素（包括用户与服务提供商所在地），我们也可能在其他国家的服务器与设备上存储信息。访问或使用本站，或以其他方式向我们提供信息，即表示你同意信息在美国及其他国家处理和传输、存储，而在这些国家你可能无法享有与当地法律下相同的权利。"
      security:
        heading: "信息安全"
        summary: "摘要：我们会采取合理措施保护你的数据，并在你的个人信息遭到泄露时及时通知你。"
        body_1: "我们会采取合理措施，保护你的个人信息免遭丢失、盗窃、滥用、未经授权的访问、披露、篡改或破坏。我们也会实施技术与管理层面的访问控制，限制员工或 %{app_name} 指定代表访问非公开个人信息。然而，尽管我们会尽力保护你的个人信息，向本服务传输个人信息及从本服务接收个人信息仍由你自行承担风险。请只在安全的环境下访问本服务。"
        body_2: "如果我们发现发生或可能发生导致你的个人信息被未经授权访问、使用或披露的隐私泄露事件，我们会调查此事，并及时通知你及相应的监管机构；但如果该泄露不太可能对自然人的权利与自由造成风险，则不在此限。"
      changes:
        heading: "本政策的变更"
        summary: "摘要：我们可能会不时更新本政策。"
        body_1: "我们可能会不时更新本隐私政策。更新后的政策会在本页顶部标注新的「最后更新」日期。如果本隐私政策发生重大变更，我们可能自行决定通过显著位置发布变更通知，或直接向你发送通知。建议你经常查阅本隐私政策，以了解我们如何处理你的个人信息。"
        body_2: "本隐私政策的变更自更新后的隐私政策可被访问时起生效。变更生效后你继续使用本服务，即表示你同意受修订后政策的约束。"
