      faq_heading: "Frequently Asked Questions"
      faq_upgrade_question: "How do I upgrade my account?"
      faq_upgrade_answer_html: "Click the \"Upgrade to Gold\" button on this page. After you purchase an upgrade, you will receive a code you can %{redeem} to upgrade your account to Gold. Look for the upgrade code in your email or on the order confirmation page. %{contact} if you have any questions."
      redeem_here: "redeem here"
      contact_us: "Contact us"
      faq_benefits_question: "What are the benefits of %{app_name} Gold?"
      faq_benefits_answer: "%{app_name} Gold lets you search for more tags at once, browse deeper in search results, keep your favorites private, and keep more favorite groups and saved searches."
      faq_tag_limit_question: "What is the tag limit?"
      faq_tag_limit_answer: "The tag limit is how many tags you can search for at once. Normal users can only search for %{limit} tags at once. Gold users can search for an unlimited number of tags at once."
      faq_tag_limit_more_html: "See %{link} for more information on searches."
      wiki_cheatsheet: "help:cheatsheet"
      faq_page_limit_question: "What is the page limit?"
      faq_page_limit_answer: "Normal users can only browse posts up to page 1000. Gold users can browse posts up to page 5000."
      faq_private_favorites_question: "What are private favorites?"
      faq_private_favorites_answer_html: "Normally your favorites are visible to everyone. Gold users can make their favorites private in their %{settings}."
      settings_link: "account settings"
      faq_favorite_groups_question: "What are favorite groups?"
      faq_favorite_groups_answer_html: "Favorite groups are like personal tags or pools. They let you organize your favorites in groups however you wish. Gold users can have an unlimited number of favorite groups. See %{link} for more details."
      wiki_favorite_groups: "help:favorite groups"
      faq_saved_searches_question: "What are saved searches?"
      faq_saved_searches_answer_html: "Saved searches let you save your favorite tags and searches. They let you easily check for new posts under your favorite tags. Gold users can keep up to 1000 saved searches. See %{link} for more details."
      wiki_saved_searches: "help:saved searches"
      faq_search_duration_question: "What is the max search duration?"
      faq_search_duration_answer: "Complicated tag searches may take longer to execute. Normal users can only do searches that take up to 3 seconds long. Gold users can do searches that take up to 6 seconds long. This means Gold users can do more complicated tag searches."
      faq_gift_question: "Can I gift an upgrade to someone else?"
      faq_gift_answer: "Sure. You can buy an upgrade code and give it to someone else."
      faq_payment_question: "What payment methods do you support?"
      faq_payment_answer: "We support all major credit and debit cards. We don't support Bitcoin at this time."
      faq_subscription_question: "Is this a subscription?"
      faq_subscription_answer: "No, this is not a subscription. This is a one-time payment only. You pay only once and keep the upgrade forever."
      faq_refund_question: "What is your refund policy?"
      faq_refund_answer_html: "You can request a refund for any reason within 48 hours of your purchase. To request a refund, %{contact} or send an email to %{email}. Please include your username in your request."
      faq_refund_note: "Refund requests will be responded to within 1 business day. Please note that it may take up to 10 business days for refunds to be processed by your bank or credit card company."

